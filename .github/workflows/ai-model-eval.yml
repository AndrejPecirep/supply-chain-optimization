name: AI Model Evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: python models/ai_demand_forecasting.py
      - run: python models/ai_supplier_risk_agent.py
      - run: python models/ai_document_parser.py
